<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offerte aanvraag zonnepanelen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="form-header">
      <div class="brand" aria-label="SolarFlow">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 16a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1ZM3 11a1 1 0 1 1 0 2H1a1 1 0 1 1 0-2h2Zm20 0a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2h2ZM5.64 4.22l1.42 1.42a1 1 0 1 1-1.42 1.42L4.22 5.64A1 1 0 1 1 5.64 4.22Zm12.72 12.72 1.42 1.42a1 1 0 1 1-1.42 1.42l-1.42-1.42a1 1 0 1 1 1.42-1.42ZM18.36 4.22a1 1 0 0 1 1.42 1.42l-1.42 1.42a1 1 0 1 1-1.42-1.42l1.42-1.42ZM5.64 19.78a1 1 0 0 1-1.42-1.42l1.42-1.42a1 1 0 1 1 1.42 1.42l-1.42 1.42Z"/></svg>
        </span>
        <span>SolarFlow</span>
      </div>
      <h1>Offerte aanvraag voor zonnepanelen</h1>
      <p>Ontvang een persoonlijke offerte voor uw woning.</p>
    </header>

    <form id="offerteForm" novalidate>
      <div class="field">
        <label for="naam">Naam</label>
        <input type="text" id="naam" name="naam" required>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6.5A2.5 2.5 0 0 1 4.5 4h15A2.5 2.5 0 0 1 22 6.5v.3l-10 5.6L2 6.8v-.3Zm0 2.6v8.4A2.5 2.5 0 0 0 4.5 20h15a2.5 2.5 0 0 0 2.5-2.5V9.1l-9.5 5.3a1 1 0 0 1-1 0L2 9.1Z"/></svg>
          <input type="email" id="email" name="email" required>
        </div>
      </div>

      <div class="field">
        <label for="telefoon">Telefoonnummer</label>
        <div class="phone">
          <select id="landcode" name="landcode" aria-label="Landcode">
            <option value="+32" selected>🇧🇪 +32</option>
            <option value="+31">🇳🇱 +31</option>
            <option value="+33">🇫🇷 +33</option>
            <option value="+49">🇩🇪 +49</option>
            <option value="+352">🇱🇺 +352</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+1">🇺🇸 +1</option>
          </select>
          <input type="tel" id="telefoon" name="telefoon" required>
        </div>
      </div>

      <div class="field">
        <label for="elektriciteitsrekening">Uw huidige elektriciteitsrekening</label>
        <input type="number" id="elektriciteitsrekening" name="elektriciteitsrekening" min="0" step="0.01" placeholder="€ per maand">
      </div>

      <div class="field">
        <label for="dakoppervlakte">Dakoppervlakte <span class="optional">(optioneel)</span></label>
        <input type="number" id="dakoppervlakte" name="dakoppervlakte" min="0" step="0.1" placeholder="m²">
      </div>

      <fieldset class="field">
        <legend>Uw adres</legend>

        <div class="field">
          <label for="adres">Adres</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
            <input type="text" id="adres" name="adres" required>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="stad">Stad</label>
            <input type="text" id="stad" name="stad" required>
          </div>
          <div class="field">
            <label for="provincie">Provincie</label>
            <select id="provincie" name="provincie">
              <option value=""></option>
              <option>Antwerpen</option>
              <option>Limburg</option>
              <option>Oost-Vlaanderen</option>
              <option>West-Vlaanderen</option>
              <option>Vlaams-Brabant</option>
              <option>Brussel</option>
              <option>Waals-Brabant</option>
              <option>Henegouwen</option>
              <option>Luik</option>
              <option>Luxemburg</option>
              <option>Namen</option>
            </select>
          </div>
          <div class="field">
            <label for="postcode">Postcode</label>
            <input type="text" id="postcode" name="postcode" required>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label for="foto">Upload een afbeelding van de voorzijde van uw woning</label>
        <label class="dropzone" id="dropzone" for="foto">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4l2 2h7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z"/></svg>
          <span id="dropText">Sleep een bestand hierheen of <u>blader</u></span>
        </label>
        <input type="file" id="foto" name="foto" accept="image/*" hidden>
      </div>

      <button type="submit" id="submitBtn">Vraag offerte aan</button>
      <p id="status" role="status"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
